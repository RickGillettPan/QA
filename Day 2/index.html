<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>ShowFinder | Find your next watch</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131d;
      color: #f4f5fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #a5a9bb;
      --accent: #b8a1ff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -20%, rgba(120, 87, 202, .28), transparent 55%),
        #10131d;
    }

    main {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 76px 0 56px;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: -.065em;
      line-height: 1;
    }

    .intro {
      max-width: 490px;
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .search-panel {
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 18px;
      background: rgba(27, 30, 44, .86);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .24);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: .9rem;
      font-weight: 650;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #41445a;
      border-radius: 10px;
      outline: none;
      background: #141723;
      color: #fff;
      font: inherit;
    }

    input::placeholder { color: #777c91; }
    input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(184, 161, 255, .2); }

    button {
      flex: 0 0 auto;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #1b152a;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: background .15s ease, transform .15s ease;
    }

    button:hover { background: #c9b8ff; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .result {
      min-height: 26px;
      margin: 18px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .result.success { color: #9de4bd; }
    .result.failure, .result.error { color: #ffaaa8; }

    .catalog {
      margin-top: 38px;
    }

    .catalog-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -.02em;
    }

    .count { color: var(--muted); font-size: .85rem; }

    .show-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .show-list li {
      padding: 17px 18px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 12px;
      background: rgba(255, 255, 255, .035);
      color: #e6e7ef;
      font-weight: 600;
    }

    footer {
      margin-top: 38px;
      color: #74798e;
      font-size: .8rem;
    }

    @media (max-width: 520px) {
      main { width: min(100% - 28px, 760px); padding-top: 52px; }
      .search-panel { padding: 18px; }
      .search-row { flex-direction: column; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Your next watch starts here</p>
    <h1>ShowFinder</h1>
    <p class="intro">Looking for a favorite? Search the small collection below and we’ll tell you if it’s here.</p>

    <section class="search-panel" aria-labelledby="search-label">
      <form id="search-form">
        <label id="search-label" for="search-term">Search TV shows</label>
        <div class="search-row">
          <input
            id="search-term"
            name="search-term"
            type="search"
            placeholder="Try “Luther”"
            autocomplete="off"
            aria-describedby="search-result"
          >
          <button type="submit">Search</button>
        </div>
      </form>
      <p class="result" id="search-result" role="status" aria-live="polite">Enter a show title to check if it’s in the collection.</p>
    </section>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <h2 id="catalog-title">Shows in the collection</h2>
        <span class="count">3 titles</span>
      </div>
      <ul class="show-list" id="show-list"></ul>
    </section>

    <footer>Search is not case-sensitive and matches part of a title.</footer>
  </main>

  <script>
    const shows = ["Doctor Who", "Sherlock", "Luther"];
    const form = document.querySelector("#search-form");
    const searchInput = document.querySelector("#search-term");
    const result = document.querySelector("#search-result");
    const showList = document.querySelector("#show-list");

    for (const show of shows) {
      const item = document.createElement("li");
      item.textContent = show;
      showList.append(item);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const searchTerm = searchInput.value.trim();
      result.className = "result";

      if (!searchTerm) {
        result.textContent = "Please enter a show title to search.";
        result.classList.add("error");
        searchInput.focus();
        return;
      }

      const match = shows.find((show) =>
        show.toLocaleLowerCase().includes(searchTerm.toLocaleLowerCase())
      );

      if (match) {
        result.textContent = `Found: ${match}`;
        result.classList.add("success");
      } else {
        result.textContent = `Not found: ${searchTerm}`;
        result.classList.add("failure");
      }
    });
  </script>
</body>
</html>
